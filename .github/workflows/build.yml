name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK packages for the phone server
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Build the app
        run: ./scripts/build-app.sh
      - name: Diagnose
        run: "'build/Android Webcam.app/Contents/MacOS/AndroidWebcam' --diagnose"
      - uses: actions/upload-artifact@v4
        with:
          name: android-webcam-app
          path: build/Android Webcam.app
