name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK packages for the phone server
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Build the app
        run: ./scripts/build-app.sh
        env:
          UNIVERSAL: "1"
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          APP_BUILD: ${{ github.run_number }}
      - name: Diagnose
        run: "'build/Closeup.app/Contents/MacOS/Closeup' --diagnose"
      # ditto keeps the bundle's permissions and signature, which a plain artifact upload of the folder loses.
      - name: Zip the app
        run: ditto -c -k --keepParent "build/Closeup.app" build/Closeup.zip
      - name: Make the disk image
        run: ./scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: closeup-app
          path: build/Closeup.zip
      - uses: actions/upload-artifact@v4
        with:
          name: closeup-dmg
          path: build/Closeup.dmg
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Closeup.dmg build/Closeup.zip --title "$GITHUB_REF_NAME" --generate-notes
